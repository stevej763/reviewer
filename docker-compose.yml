# Runs Reviewer in Docker on this Mac. The AI model runs in the native Ollama app
# (Docker on a Mac can't use the GPU), which the container reaches at
# http://host.docker.internal:11434.
services:
  reviewer:
    build: .
    image: reviewer:latest
    container_name: reviewer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Pre-fills the setup screen; the saved value in Settings wins after that.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      # Only reachable from this Mac. Open http://localhost:8000
      - "127.0.0.1:${REVIEWER_PORT:-8000}:8000"
    volumes:
      - reviewer-data:/data

volumes:
  reviewer-data:
